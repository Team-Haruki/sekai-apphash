# sekai-apphash configuration example.
#
# Copy to config.toml and fill in the package sources. Every key can be
# overridden from the environment with the SEKAI_APPHASH_ prefix and `__`
# between levels, e.g.:
#   SEKAI_APPHASH_REGIONS__JP__URL=https://...
#   SEKAI_APPHASH_PUBLISH__HARUKI__TOKEN=...      (keep tokens out of this file)
# The config file itself is passed with --config or SEKAI_APPHASH_CONFIG.

[log]
level = "info"          # RUST_LOG overrides it
format = "text"         # text | json

[http]
# Some download mirrors only serve browser-like user agents.
user_agent = "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
connect_timeout_secs = 15
timeout_secs = 120
# proxy = "socks5://127.0.0.1:1080"
page_size_kib = 256     # range request granularity
cache_mib = 128         # range cache budget per package

[state]
# Last fingerprint, identity and deliveries per region. "" disables caching.
dir = "state"

[schedule]
interval_secs = 600     # serve: time between passes
jitter_secs = 120       # plus a random 0..=jitter_secs
region_timeout_secs = 900

[service]
# serve: read-only GET /health, /v1/identity, /v1/identity/{region}. "" = off.
listen = ""

# One section per region. `url` must point to the package (APK, XAPK or IPA)
# and answer HTTP range requests; redirects are followed. Only the zip
# directory and the entries holding the manifest and the Unity data are read.
[regions.jp]
url = "https://downloads.example.com/jp/latest.xapk"
# platform = "android"  # which production config to report: android | ios
# headers = { Referer = "https://downloads.example.com/" }
# proxy = "http://127.0.0.1:7890"  # this source only; "" = direct; unset = http.proxy

[regions.en]
url = "https://downloads.example.com/en/latest.xapk"

# A region can instead list `sources`, tried in order until one yields the
# identity (an unusable source is logged and the next one is tried):
#   kind = "direct"   download_url is the package itself (what `url` means)
#   kind = "qooapp"   check_url is a QooApp v11 store API entry
#                     (.../store/v11/apps/<app id>); the package is
#                     download_url with {package_id} filled in, or the
#                     UnityDataAssetPack split the API lists. The MD5 the API
#                     reports detects new builds without downloading.
# Each source may set enabled, name, channel (a [channels.*] header set),
# headers, proxy and packages (Android package names accepted for the region;
# default: the region's own, e.g. QooApp serves TW as com.hermes.mk.asia.qooapp).
# `url` and `sources` are not combined.
[regions.tw]
[[regions.tw.sources]]
name = "mirror"
download_url = "https://downloads.example.com/tw/latest.xapk"

[[regions.tw.sources]]
name = "qooapp"
enabled = false
kind = "qooapp"
check_url = "https://store.example.com/store/v11/apps/12345"
download_url = "https://store.example.com/v11/apps/{package_id}/download"
channel = "qoo"
packages = ["com.hermes.mk.asia", "com.hermes.mk.asia.qooapp"]

[regions.kr]
url = "https://downloads.example.com/kr/latest.xapk"

[regions.cn]
url = "https://downloads.example.com/cn/latest.apk"
# proxy = ""            # e.g. reach this source directly while the others use http.proxy
# enabled = false

# Request header sets for sources (`channel = "..."`). Values are treated as
# credentials and never logged; `_` in a name reads as `-`. Keep tokens out of
# this file and set them from the environment instead, e.g.
#   SEKAI_APPHASH_CHANNELS__QOO__HEADERS__X_USER_TOKEN=...
# While a header in required_headers is empty, the channel's sources are
# skipped without a request (one warning per run). Accept-Encoding,
# Connection, Keep-Alive, Host, Range and Content-Length are managed by the
# client and ignored here.
[channels.qoo]
required_headers = ["x-user-token"]

[channels.qoo.headers]
Accept = "*/*"
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
x-version-code = "90101"
x-version-name = "9.1.1"
x-device-abis = ""
x-device-id = ""        # from the environment if the account needs it
x-device-uuid = ""
x-user-token = ""       # SEKAI_APPHASH_CHANNELS__QOO__HEADERS__X_USER_TOKEN

# Haruki-Sekai-API: POST {base_url}/internal/app-identity with the node's
# backend.internal_token. The node's current identity is read first
# (GET /internal/master/{region}/version): nothing is sent when it already
# matches, and older versions are refused. When it cannot be read, nothing is
# sent and the run fails.
[publish.haruki]
enabled = false
base_url = "http://127.0.0.1:9999"
# token = ""            # use SEKAI_APPHASH_PUBLISH__HARUKI__TOKEN instead
regions = []            # [] = every region checked in the pass
refuse_downgrade = true
# Regions whose version file has an empty appVersion (a brand-new region):
# allow the first push there. Remove the region once it is bootstrapped.
bootstrap_regions = []
timeout_secs = 20

# Write identities as JSON (only when they change).
[publish.file]
enabled = false
path = "out/apphash.json"   # one object keyed by region
# dir = "out/regions"       # or one <region>.json per region
pretty = true

# Any number of webhooks: POST {"event":"app-identity","region":..,"identity":{..}}
# when an identity changes.
[publish.webhooks.example]
enabled = false
url = "https://hooks.example.com/sekai-apphash"
# bearer_token = ""     # SEKAI_APPHASH_PUBLISH__WEBHOOKS__EXAMPLE__BEARER_TOKEN
# hmac_secret = ""      # SEKAI_APPHASH_PUBLISH__WEBHOOKS__EXAMPLE__HMAC_SECRET
regions = []
timeout_secs = 20
